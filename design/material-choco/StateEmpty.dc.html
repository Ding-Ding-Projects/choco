<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Empty and offline states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Flex:opsz,wdth,wght@8..144,100..125,400..800&family=Roboto+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
a{color:#006A6A}a:hover{color:#002020}
@keyframes mc-rise{from{opacity:0;transform:translateY(28px) scale(.96)}to{opacity:1;transform:none}}
@keyframes mc-slide{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes mc-pop{0%{transform:scale(.8)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes mc-pulse{0%{box-shadow:0 0 0 0 rgba(0,106,106,.55)}100%{box-shadow:0 0 0 14px rgba(0,106,106,0)}}
@keyframes mc-alarm{0%{box-shadow:0 0 0 0 rgba(186,26,26,.5)}100%{box-shadow:0 0 0 22px rgba(186,26,26,0)}}
@keyframes mc-shake{0%,100%{transform:none}15%{transform:translateX(-10px) rotate(-1deg)}30%{transform:translateX(9px) rotate(1deg)}45%{transform:translateX(-6px)}60%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
@keyframes mc-shimmer{from{background-position:-480px 0}to{background-position:480px 0}}
@keyframes mc-wave{from{background-position:0 0}to{background-position:48px 0}}
@keyframes mc-morph{0%,100%{border-radius:38% 62% 55% 45%/48% 40% 60% 52%;transform:rotate(0)}33%{border-radius:60% 40% 38% 62%/55% 62% 38% 45%}66%{border-radius:45% 55% 62% 38%/38% 48% 52% 62%;transform:rotate(18deg)}}
@keyframes mc-spin{to{transform:rotate(360deg)}}
@keyframes mc-draw{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
@keyframes mc-confetti{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(150px) rotate(300deg);opacity:0}}
@keyframes mc-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes d-iris{from{clip-path:circle(0% at 50% 50%)}to{clip-path:circle(150% at 50% 50%)}}
@keyframes d-stamp{0%{opacity:0;transform:scale(3.4) rotate(-18deg)}55%{opacity:1;transform:scale(.86) rotate(3deg)}75%{transform:scale(1.08) rotate(-1deg)}100%{transform:scale(1)}}
@keyframes d-title{0%{opacity:0;transform:translateY(60px) scale(.7);letter-spacing:12px}60%{opacity:1;transform:translateY(-8px) scale(1.06)}100%{transform:none;letter-spacing:-1px}}
@keyframes d-ring{from{transform:scale(.2);opacity:.9}to{transform:scale(3.2);opacity:0}}
@keyframes d-ray{to{transform:rotate(360deg)}}
@keyframes d-fall{0%{transform:translateY(-80px) rotate(0)}100%{transform:translateY(860px) rotate(700deg)}}
@keyframes d-quake{10%{transform:translate(-14px,6px) rotate(-.6deg)}20%{transform:translate(12px,-8px) rotate(.5deg)}30%{transform:translate(-10px,-4px)}40%{transform:translate(9px,7px)}50%{transform:translate(-6px,3px)}60%{transform:translate(5px,-3px)}70%{transform:translate(-3px,2px)}}
@keyframes d-glitch{0%,100%{text-shadow:none;transform:none}20%{text-shadow:-6px 0 rgba(0,255,255,.55),6px 0 rgba(255,0,255,.55);transform:skewX(-6deg)}40%{text-shadow:5px 0 rgba(0,255,255,.55),-5px 0 rgba(255,0,255,.55);transform:skewX(4deg)}}
@keyframes d-scan{to{background-position:0 24px}}
.mc-press{transition:transform 180ms cubic-bezier(.2,1.4,.4,1),border-radius 260ms,filter 180ms}.mc-press:hover{transform:scale(1.04);filter:brightness(1.06)}.mc-press:active{transform:scale(.95);border-radius:12px}
.mc-lift{transition:transform 260ms cubic-bezier(.2,1.3,.4,1),box-shadow 260ms}.mc-lift:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(42,23,8,.12)}
.mc-still,.mc-still *{animation:none !important;transition:none !important}
@media (prefers-reduced-motion: reduce){*{animation-duration:1ms !important;animation-iteration-count:1 !important;transition-duration:1ms !important}}
</style>
</helmet>
<div class="{{motionClass}}">
<div style="font-family: Roboto, system-ui, sans-serif; background: #FCF8F6; color: #211A16; min-height: 620px; box-sizing: border-box; padding: 40px 32px; display: flex; flex-direction: column; gap: 20px"><h1 style="font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; font-stretch: 112%; margin: 0; font-size: 44px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.05; animation: mc-slide 520ms cubic-bezier(0.2, 1.2, 0.4, 1) both">Machines</h1><div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch;  "><section class="mc-lift" style="animation: mc-rise 620ms cubic-bezier(0.2, 1.35, 0.4, 1) 490ms both; background: #F7F1EE; border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 12px; min-width: 0; flex: 1 1 320px; align-items: flex-start"><div style="display: flex; justify-content: center; padding: 8px 0; animation: mc-float 3.2s ease-in-out infinite"><span aria-hidden="true" style="width: 112px; height: 112px; background: #FFDBC8; display: inline-flex; align-items: center; justify-content: center; flex: none; border-radius: 38% 62% 55% 45% / 48% 40% 60% 52%; animation: mc-morph 7s ease-in-out infinite"><svg aria-hidden="true" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#311300" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M4 4h16v6H4zM4 14h16v6H4zM8 7h.01M8 17h.01"></path></svg></span></div><h2 style="font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; font-stretch: 112%; margin: 0; font-size: 24px; font-weight: 600; color: #211A16; line-height: 1.25">No machines yet</h2><p style="margin: 0; font-size: 14px; color: #53433B; line-height: 1.45">Nothing is enrolled, so there is nothing to show. Pair the first Windows machine to begin.</p><button type="button" style="background: {{accent}}; color: #FFFFFF; border: 0; font-family: Roboto, system-ui, sans-serif; height: 48px; padding: 0 24px; border-radius: 24px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap" class="mc-press"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M12 5v14M5 12h14"></path></svg>Enroll a machine</button></section><section class="mc-lift" style="animation: mc-rise 620ms cubic-bezier(0.2, 1.35, 0.4, 1) 0ms both; background: #EBE5E2; border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 12px; min-width: 0; flex: 1 1 320px"><div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center;  "><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 7px; background: #85736A"></span><h2 style="font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; font-stretch: 112%; margin: 0; font-size: 24px; font-weight: 600; color: #211A16; line-height: 1.25">LAB-PC-07 is offline</h2></div><p style="margin: 0; font-size: 14px; color: #53433B; line-height: 1.45">Last seen 2026-11-12 09:14:51 EST. Jobs wait in the queue for up to 7 days, then expire.</p><div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center;  "><span style="display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 12px; font-size: 12px; font-weight: 500; background: #FFDBC8; color: #311300; white-space: nowrap; align-self: flex-start">2 jobs waiting</span><span style="display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 12px; font-size: 12px; font-weight: 500; background: #EBE5E2; color: #53433B; white-space: nowrap; align-self: flex-start">Inventory may be stale</span></div><div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center;  "><button type="button" style="background: transparent; color: {{accent}}; border: 1px solid #85736A; font-family: Roboto, system-ui, sans-serif; height: 48px; padding: 0 24px; border-radius: 24px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap" class="mc-press">Cancel waiting jobs</button><button type="button" style="background: transparent; color: {{accent}}; border: 0; font-family: Roboto, system-ui, sans-serif; height: 48px; padding: 0 14px; border-radius: 24px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap" class="mc-press">Open machine</button></div></section></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8A3F0B","options":["#8A3F0B","#006A6A","#A6276A","#3E5BA9"],"section":"Look"},"motion":{"editor":"boolean","default":true,"section":"Look"},"$preview":{"width":900,"height":620}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#8A3F0B';
return { accent: accent, motionClass: (this.props.motion ?? true) ? '' : 'mc-still' };
}
}
</script>
</body>
</html>
