<style>

ter; gap: 12px; color: #53433B; font-size: 13px"><span style="flex: 1; height: 1px; background: #D8C2B7"></span>or use your password<span style="flex: 1; height: 1px; background: #D8C2B7"></span></div><label style="display: flex; flex-direction: column; gap: 4px; flex: 0 0 auto; min-width: 0"><span style="font-size: 12px; font-weight: 500; color: #53433B">Name</span><input type="text" value="admin"  style="font-family: Roboto, system-ui, sans-serif; height: 48px; box-sizing: border-box; width: 100%; border: 1px solid #85736A; border-radius: 6px; background: transparent; padding: 0 14px; font-size: 15px; color: #211A16"></label><label style="display: flex; flex-direction: column; gap: 4px; flex: 0 0 auto; min-width: 0"><span style="font-size: 12px; font-weight: 500; color: #53433B">Password</span><input type="password" value=""  style="font-family: Roboto, system-ui, sans-serif; height: 48px; box-sizing: border-box; width: 100%; border: 1px solid #85736A; border-radius: 6px; background: transparent; padding: 0 14px; font-size: 15px; color: #211A16"></label><button type="button" style="background: #FFDBC8; color: #311300; border: 0; font-family: Roboto, system-ui, sans-serif; height: 48px; padding: 0 24px; border-radius: 24px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap" class="mc-press"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M6 11h12v9H6zM9 11V7a3 3 0 0 1 6 0v4"></path></svg>Sign in with password</button></div></div>
