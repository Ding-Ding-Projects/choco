<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Material Choco demo</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<!-- The demo backend answers every hub request from memory in this page. It must load before the app. -->
<script src="js/demo-backend.js"></script>
<script type="module" src="vendor/material-web.js"></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<noscript>The Material Choco demo needs JavaScript to run.</noscript>
<aside class="demobanner" id="demobanner" aria-label="About this demo">
<b>Demo</b>
<p>These machines are simulated. Nothing is installed anywhere and nothing leaves this browser. <a href="../">Back to the site</a> or <a href="https://github.com/Ding-Ding-Projects/choco/releases/latest">download the real app</a>.</p>
<div class="acts">
<button type="button" id="demo-join" title="Adds a sample machine, as if an agent had used the newest pairing code">Simulate a machine joining</button>
<button type="button" id="demo-reset" title="Reloads the page, which puts every simulated machine back">Reset demo</button>
</div>
<span role="status" aria-live="polite" id="demo-status"></span>
</aside>
<div id="root"></div>
<script>
// Keeps the app's sticky bars below the banner and wires the two demo controls.
(() => {
  const banner = document.getElementById('demobanner'); const status = document.getElementById('demo-status'); const demo = window.materialChocoDemo;
  const size = () => document.documentElement.style.setProperty('--banner', banner.offsetHeight + 'px');
  new ResizeObserver(size).observe(banner); size();
  document.getElementById('demo-reset').addEventListener('click', () => demo.reset());
  document.getElementById('demo-join').addEventListener('click', async () => { const r = await demo.join(); status.textContent = r.error ? r.error : r.name + ' joined with the pairing code. It is a simulated machine like the others.'; });
})();
</script>
</body>
</html>
